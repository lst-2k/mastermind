<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Match</title>
<style>
:root{--bg:#1c1410;--bg2:#3a2a1e;--fg:#f4e9d8;--wood:#6b4426;--wood2:#4a2d17;--hole:#1a0f08;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9dcc6;--bg2:#cdb48f;--fg:#2a1a0d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px 10px 30px}
h1{margin:4px 0;font-size:22px;letter-spacing:2px}
#msg{text-align:center;min-height:42px;font-size:15px;max-width:340px;margin:4px 0}
#home{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:30px}
#home input{font-size:22px;text-align:center;text-transform:uppercase;width:150px;padding:10px;border-radius:10px;border:2px solid #d9962b;background:#fff;color:#2a1a0d;letter-spacing:4px}
.scene{perspective:800px;width:100%;max-width:290px;margin:4px 0 40px}
.board{transform:rotateX(22deg);transform-style:preserve-3d;background:linear-gradient(160deg,var(--wood),var(--wood2));border-radius:16px;padding:10px;box-shadow:0 30px 30px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,255,255,.2),0 8px 0 #2b190b}
.shield{position:relative;background:#222;border-radius:10px;padding:0;margin-bottom:8px;box-shadow:inset 0 3px 8px #000}
.cover{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#9aa0a8,#4b5058 60%,#7d838b);box-shadow:0 6px 10px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:3px;color:#222;transform-origin:top;transition:transform .8s,opacity .8s}
.cover.open{transform:rotateX(-80deg) translateY(-10px);opacity:0;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;border-radius:10px;margin:3px 0}
.row.cur{background:rgba(255,220,150,.18);box-shadow:0 0 0 2px #ffd27a}
.slots{display:flex;gap:10px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:30px}
.hole,.peg{width:30px;height:30px;border-radius:50%}
.hole{background:radial-gradient(circle at 60% 65%,#3a2616,var(--hole));box-shadow:inset 0 3px 5px #000,0 1px 0 rgba(255,255,255,.2)}
.peg{background:radial-gradient(circle at 34% 28%,#fffa 0,transparent 22%),radial-gradient(circle at 50% 50%,var(--c) 0 50%,var(--d) 54%,var(--c) 60% 100%);box-shadow:0 5px 0 var(--d),0 9px 8px rgba(0,0,0,.55),inset 0 -3px 4px rgba(0,0,0,.3);transform:translateY(-3px)}
.fb .hole,.fb .peg{width:13px;height:13px}
.fb .hole{box-shadow:inset 0 2px 3px #000}
.fb .peg{box-shadow:0 2px 0 var(--d),0 4px 4px rgba(0,0,0,.6);transform:translateY(-1px)}
.fb.tap>*{cursor:pointer;outline:1px solid #ffd27a;outline-offset:1px}
.mk-r{--c:#ff3b30;--d:#8a0b05}.mk-w{--c:#fff;--d:#999}
.pal{position:relative;z-index:2;display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap;justify-content:center}
.pal .peg{border:0;cursor:pointer;width:38px;height:38px;padding:0}
@media (hover:hover){.pal .peg:hover{transform:translateY(-7px)}}
.pal .peg{transition:transform .12s}
.pal .peg:active{transform:translateY(3px) scale(.95)}
.slots .sel{outline:3px solid #ffd27a;outline-offset:3px;border-radius:50%}
.logo{display:flex;gap:2px;font-size:36px;font-weight:900;margin:2px 0 6px;letter-spacing:0}
.logo span{color:var(--c);text-shadow:0 1px 0 var(--d),0 2px 0 var(--d),0 3px 0 var(--d),0 4px 0 var(--d),0 5px 0 var(--d),0 9px 8px rgba(0,0,0,.5)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(59,130,246,.25),transparent 30%),radial-gradient(circle at 80% 20%,rgba(168,85,247,.22),transparent 30%),radial-gradient(circle at 70% 80%,rgba(34,197,94,.2),transparent 30%),radial-gradient(circle at 25% 85%,rgba(250,204,21,.2),transparent 30%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg) scale(1.1)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgp{position:absolute;bottom:-60px;opacity:.28;filter:blur(.6px);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
.logo span{animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.12s)}
@keyframes wave{50%{transform:translateY(-5px)}}
.peg.pop{animation:pop .3s ease-out}
@keyframes pop{0%{scale:.3}60%{scale:1.25}100%{scale:1}}
.row.cur{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #ffd27a,0 0 16px 3px rgba(255,210,122,.65)}}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:9;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#bg,.cf{display:none}.logo span,.row.cur{animation:none}}
.flip .board{transform:rotateX(22deg) rotateZ(180deg);box-shadow:0 -30px 30px rgba(0,0,0,.55),inset 0 -2px 4px rgba(255,255,255,.2),0 -8px 0 #2b190b}
.flip .peg{background:radial-gradient(circle at 66% 72%,#fffa 0,transparent 22%),radial-gradient(circle at 50% 50%,var(--c) 0 50%,var(--d) 54%,var(--c) 60% 100%);box-shadow:0 -5px 0 var(--d),0 -9px 8px rgba(0,0,0,.55),inset 0 3px 4px rgba(0,0,0,.3);transform:translateY(3px)}
.flip .fb .peg{box-shadow:0 -2px 0 var(--d),0 -4px 4px rgba(0,0,0,.6);transform:translateY(1px)}
.flip .hole{box-shadow:inset 0 -3px 5px #000,0 -1px 0 rgba(255,255,255,.2)}
.btns{display:flex;gap:10px;position:relative;z-index:3}
button.act,a.act{background:linear-gradient(#ffd27a,#d9962b);border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;color:#2a1a0d;box-shadow:0 5px 0 #8a5a12;cursor:pointer}
button.act:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a12}
button.act:disabled{opacity:.4}
button.sec,a.sec{background:#555;color:#fff;box-shadow:0 5px 0 #222}
a.act{text-decoration:none;display:inline-block}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:5;background:rgba(0,0,0,.45);border:0;border-radius:50%;width:40px;height:40px;font-size:18px;color:#fff;cursor:pointer}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body>
<audio id="bgm" src="audio.mp3" loop preload="auto"></audio>
<button id="mute" aria-label="Mute music">🔊</button>
<h1 class="logo" id="logo"></h1>
<div id="msg"></div>
<div id="home">
 <button class="act" id="cpu">Play vs computer</button>
 <div>or play a friend online</div>
 <button class="act sec" id="create">Create game (be the code setter)</button>
 <div>or join a friend's game</div>
 <input id="rid" maxlength="4" placeholder="CODE">
 <button class="act sec" id="joinb">Join game</button>
</div>
<div id="game" style="display:none;width:100%;flex-direction:column;align-items:center">
<div class="scene" id="scene"><div class="board">
<div class="shield"><div class="row"><div class="slots" id="code"></div><div class="fb"></div></div><div class="cover" id="cover">SECRET CODE</div></div>
<div id="rows" style="display:flex;flex-direction:column-reverse"></div>
</div></div>
<div class="pal" id="pal"></div>
<div id="sharebox" style="display:none;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;position:relative;z-index:3"><a class="act" id="wa" target="_blank" rel="noopener">WhatsApp</a><a class="act sec" id="sms">SMS</a><button class="act sec" id="cp">Copy link</button></div>
<div class="btns"><button class="act sec" id="menu">Menu</button><button class="act sec" id="share" style="display:none">Share</button><button class="act sec" id="clr">Clear</button><button class="act" id="go">OK</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ===== FIREBASE CONFIG =====
const CFG={apiKey:"AIzaSyBp1yA1BRp6B_CfLmLQE4DLN8J6_1kJEXc",authDomain:"mastermind-eb4ee.firebaseapp.com",databaseURL:"https://mastermind-eb4ee-default-rtdb.europe-west1.firebasedatabase.app",projectId:"mastermind-eb4ee",storageBucket:"mastermind-eb4ee.firebasestorage.app",messagingSenderId:"671202526007",appId:"1:671202526007:web:186cf78eb69ac74b87d0b2"};
// ===========================================
const COLS=[["#3b82f6","#0b2f78"],["#22c55e","#0a5a22"],["#facc15","#8a6c00"],["#f97316","#8a3600"],["#a855f7","#4a1580"],["#06b6d4","#055a6a"]];
const ROWS=10,$=id=>document.getElementById(id),arr=o=>o?Object.values(o):[];
let pop=-1,cel=false,lastM=null,sel=null,cpu=false,db,ref,rid,role,code=[],setup=[],cur=[],pm=[],D={status:"setup",guesses:[],marks:[],code:null},act=()=>{};
let uid=null,authP=Promise.resolve();
try{firebase.initializeApp(CFG);db=firebase.database();authP=firebase.auth().signInAnonymously().then(c=>{uid=c.user.uid})}catch(e){}
"CODE MATCH".split("").forEach((ch,i)=>{const e=document.createElement("span");e.style.setProperty("--i",i);if(ch==" ")e.style.width="14px";else{const c=COLS[i%6];e.textContent=ch;e.style.setProperty("--c",c[0]);e.style.setProperty("--d",c[1])}$("logo").appendChild(e)});
let AC;function snd(f,d,t,v,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const T=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d)}catch(e){}}
const tap=()=>snd(520,.09,"triangle",.25,240);
const ping=()=>{snd(1320,.5,"sine",.18);setTimeout(()=>snd(1760,.6,"sine",.12),90)};
function startMusic(){const a=$("bgm");a.volume=.35;a.play().catch(()=>{})}
function chk(){const n=D.marks.length;if(lastM!=null&&n>lastM)ping();lastM=n}
(()=>{const b=document.createElement("div");b.id="bg";for(let i=0;i<16;i++){const c=COLS[i%6],e=document.createElement("div"),z=18+Math.random()*34;e.className="peg bgp";e.style.cssText=`--c:${c[0]};--d:${c[1]};width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${16+Math.random()*18}s;animation-delay:-${Math.random()*30}s`;b.appendChild(e)}document.body.prepend(b)})();
function confetti(){[523,659,784,1047].forEach((f,k)=>setTimeout(()=>snd(f,.4,"triangle",.2),k*120));for(let i=0;i<70;i++){const e=document.createElement("div");e.className="cf";const c=COLS[i%6];e.style.cssText=`left:${Math.random()*100}vw;background:${c[0]};animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*.6}s;--dx:${(Math.random()-.5)*160}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),5200)}}
function peg(i){const e=document.createElement("div");if(i==null||i<0){e.className="hole";return e}e.className="peg";e.style.setProperty("--c",COLS[i][0]);e.style.setProperty("--d",COLS[i][1]);return e}
function feedback(g,c){let r=0,w=0,gc=[],cc=[];for(let i=0;i<4;i++){if(g[i]==c[i])r++;else{gc.push(g[i]);cc.push(c[i])}}gc.forEach(x=>{const k=cc.indexOf(x);if(k>-1){w++;cc.splice(k,1)}});return[r,w]}
const eff=t=>sel!=null?sel:[0,1,2,3].find(j=>t[j]==null);
function slot(i){const t=role=="p1"?setup:cur;t[i]=undefined;sel=i;render()}
function listen(){ref.on("value",s=>{const v=s.val();if(!v){D={status:"setup",guesses:[],marks:[],code:null};}else D={status:v.status||"setup",guesses:arr(v.guesses),marks:arr(v.marks),code:v.code?arr(v.code):null};
 chk();render()})}
function startCpu(){cpu=true;lastM=0;rid="CPU";role="p2";cur=[];code=Array.from({length:4},()=>Math.random()*6|0);D={status:"play",guesses:[],marks:[],code:null};
 ref={child:()=>({set:g=>{D.guesses.push(g);const n=D.guesses.length-1,[r,w]=feedback(g,code);D.marks.push({r,w});chk();if(r==4){D.status="won";D.code=code}else if(n+1>=ROWS){D.status="lost";D.code=code}render()}})};
 $("home").style.display="none";$("game").style.display="flex";render()}
$("cpu").onclick=()=>{startMusic();startCpu()};
function enter(r){lastM=null;role=r;$("home").style.display="none";$("game").style.display="flex";listen()}
$("create").onclick=()=>{startMusic();if(!db||CFG.apiKey.startsWith("YOUR"))return $("msg").textContent="Add your Firebase config at the top of the file first.";
 rid=Math.random().toString(36).slice(2,6).toUpperCase();ref=db.ref("rooms/"+rid);authP.then(()=>ref.set({status:"setup",host:uid})).then(()=>enter("p1")).catch(()=>$("msg").textContent="Couldn't create the game. Check your sign-in and database rules.")};
$("joinb").onclick=()=>{startMusic();if(!db||CFG.apiKey.startsWith("YOUR"))return $("msg").textContent="Add your Firebase config at the top of the file first.";
 rid=$("rid").value.trim().toUpperCase();if(rid.length<4)return;ref=db.ref("rooms/"+rid);authP.then(()=>ref.once("value")).then(s=>{if(!s.exists())return $("msg").textContent="No game with that code.";enter("p2")}).catch(()=>$("msg").textContent="Couldn't join. Check your connection.")};
function render(){
 if(!role)return;
 const G=D.guesses,M=D.marks,over=D.status=="won"||D.status=="lost",p1=role=="p1";
 $("scene").classList.toggle("flip",p1&&!cpu);
 if(D.status=="won"){if(!cel){cel=true;confetti()}}else cel=false;
 const turnP2=!p1&&D.status=="play"&&G.length==M.length,pending=p1&&D.status=="play"&&G.length>M.length;
 const cs=$("code");cs.innerHTML="";
 const shown=p1?(D.status=="setup"?setup:code):(D.code||[]);
 const setting=p1&&D.status=="setup";
 for(let i=0;i<4;i++){const p=peg(shown[i]);if(i==pop)p.classList.add("pop");if(setting){p.onclick=()=>slot(i);if(i==eff(setup))p.classList.add("sel")}cs.appendChild(p)}
 $("cover").classList.toggle("open",p1||!!D.code);
 const rows=$("rows");rows.innerHTML="";
 for(let r=0;r<ROWS;r++){
  const row=document.createElement("div");row.className="row"+((r==G.length&&turnP2)||(pending&&r==M.length)?" cur":"");
  const sl=document.createElement("div");sl.className="slots";
  for(let i=0;i<4;i++){let v=G[r]?G[r][i]:(r==G.length&&turnP2?cur[i]:null);const p=peg(v);if(r==G.length&&turnP2&&i==pop)p.classList.add("pop");
   if(r==G.length&&turnP2){p.onclick=()=>slot(i);if(i==eff(cur))p.classList.add("sel")}sl.appendChild(p)}
  const fb=document.createElement("div");fb.className="fb";
  const isP=pending&&r==M.length;if(isP)fb.classList.add("tap");
  for(let k=0;k<4;k++){let e,t=0;
   if(M[r]){t=k<M[r].r?1:(k<M[r].r+M[r].w?2:0)}else if(isP)t=pm[k]||0;
   e=document.createElement("div");e.className=t?"peg "+(t==1?"mk-r":"mk-w"):"hole";
   if(isP)e.onclick=()=>{pm[k]=((pm[k]||0)+1)%3;render()};fb.appendChild(e)}
  row.append(sl,fb);rows.appendChild(row)}
 const pal=$("pal"),go=$("go"),clr=$("clr"),m=$("msg");
 $("share").style.display=(p1&&!cpu)?"":"none";if(!(p1&&!cpu))$("sharebox").style.display="none";
 const canPick=(p1&&D.status=="setup")||turnP2;pal.style.display=canPick?"flex":"none";
 clr.style.display=canPick?"":"none";go.style.display="";go.disabled=false;
 const tag=cpu?"<small>vs Computer</small><br>":`<small>Room <b>${rid}</b></small><br>`;
 if(p1&&D.status=="setup"){m.innerHTML=tag+"<b>Code setter:</b> choose 4 colours, then lock it in. Share the room code with Player 2.";go.textContent="Lock code";go.disabled=setup.filter(x=>x!=null).length<4;
  act=()=>{code=setup.slice();ref.update({status:"play"})}}
 else if(pending){m.innerHTML=tag+"<b>Place the markers:</b> tap a small hole to cycle 🔴 / ⚪ / empty.<br>🔴 right spot · ⚪ right colour, wrong spot";go.textContent="Confirm markers";
  act=()=>{const n=M.length,[r,w]=feedback(G[n],code),pr=pm.filter(x=>x==1).length,pw=pm.filter(x=>x==2).length;
   if(pr!=r||pw!=w){$("rows").classList.remove("shake");void $("rows").offsetWidth;$("rows").classList.add("shake");$("msg").innerHTML+="<br>❌ Those markers aren't right, check again.";return}
   const u={};u["marks/"+n]={r,w};if(r==4){u.status="won";u.code=code}else if(n+1>=ROWS){u.status="lost";u.code=code}
   pm=[];ref.update(u)}}
 else if(p1&&D.status=="play"){m.innerHTML=tag+"Waiting for Player 2's guess…";go.style.display="none"}
 else if(over){m.innerHTML=tag+(D.status=="won"?`🎉 <b>Code cracked</b> in ${G.length} ${G.length==1?"guess":"guesses"}!`:"💥 <b>Out of guesses!</b> The code is revealed.");
  if(p1){go.textContent="New game";act=()=>{code=[];setup=[];pm=[];ref.update({status:"setup",guesses:null,marks:null,code:null})}}else if(cpu){go.textContent="Play again";act=startCpu}else{go.style.display="none"}}
 else if(!p1&&D.status=="setup"){m.innerHTML=tag+"Waiting for the code setter to lock the code…";go.style.display="none"}
 else if(turnP2){m.innerHTML=tag+`<b>Your guess:</b> ${G.length+1} of ${ROWS}. Pick 4 colours.`;go.textContent="Submit guess";go.disabled=[0,1,2,3].some(i=>cur[i]==null);
  act=()=>{const g=cur.slice();cur=[];ref.child("guesses/"+G.length).set(g)}}
 else{m.innerHTML=tag+"Waiting for the code setter to place markers…";go.style.display="none"}
}
COLS.forEach((c,i)=>{const b=document.createElement("button");b.className="peg";b.style.setProperty("--c",c[0]);b.style.setProperty("--d",c[1]);b.setAttribute("aria-label","colour "+(i+1));
 b.onclick=()=>{const t=role=="p1"?setup:cur,k=eff(t);if(k!=null){t[k]=i;sel=null;tap();pop=k}render();pop=-1};$("pal").appendChild(b)});
$("clr").onclick=()=>{if(role=="p1")setup=[];else cur=[];sel=null;render()};
$("menu").onclick=()=>{if(ref&&ref.off)ref.off();ref=null;role=null;cpu=false;code=[];setup=[];cur=[];pm=[];sel=null;lastM=null;D={status:"setup",guesses:[],marks:[],code:null};$("game").style.display="none";$("home").style.display="flex";$("msg").textContent=""};
$("go").onclick=()=>{sel=null;act()};
const link=()=>location.href.split(/[?#]/)[0]+"?room="+rid,txt=()=>"Join my Code Match game! Room code: "+rid+" "+link();
$("share").onclick=async()=>{if(navigator.share){try{await navigator.share({title:"Code Match",text:"Join my Code Match game! Room code: "+rid,url:link()});return}catch(e){if(e&&e.name=="AbortError")return}}
 $("wa").href="https://wa.me/?text="+encodeURIComponent(txt());$("sms").href="sms:?&body="+encodeURIComponent(txt());$("sharebox").style.display="flex"};
$("cp").onclick=()=>{const t=txt();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$("cp").textContent="Copied!").catch(()=>prompt("Copy this:",t))};
$("mute").onclick=()=>{const a=$("bgm");a.muted=!a.muted;$("mute").textContent=a.muted?"🔇":"🔊"};
const q=new URLSearchParams(location.search).get("room");if(q){$("rid").value=q.toUpperCase().slice(0,4);$("msg").textContent="You've been invited! Tap Join game."}
</script></body></html>
